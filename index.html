  <script>
    // Automatically update the copyright year
    document.getElementById("current-year").textContent =
      new Date().getFullYear();

    // BANNER SLIDER
    const bannerSlides = document.querySelectorAll(".banner-slide");
    const sliderDots = document.querySelectorAll(".slider-dot");
    const prevBanner = document.getElementById("prevBanner");
    const nextBanner = document.getElementById("nextBanner");
    const bannerSlider = document.getElementById("bannerSlider");

    let currentBanner = 0;
    let bannerTimer;

    function showBanner(index) {
      currentBanner =
        (index + bannerSlides.length) % bannerSlides.length;

      bannerSlides.forEach((slide, i) => {
        slide.classList.toggle("active", i === currentBanner);
      });

      sliderDots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentBanner);
        dot.setAttribute(
          "aria-current",
          i === currentBanner ? "true" : "false"
        );
      });
    }

    function startBannerTimer() {
      clearInterval(bannerTimer);

      bannerTimer = setInterval(() => {
        showBanner(currentBanner + 1);
      }, 5000);
    }

    prevBanner.addEventListener("click", () => {
      showBanner(currentBanner - 1);
      startBannerTimer();
    });

    nextBanner.addEventListener("click", () => {
      showBanner(currentBanner + 1);
      startBannerTimer();
    });

    sliderDots.forEach((dot, i) => {
      dot.addEventListener("click", () => {
        showBanner(i);
        startBannerTimer();
      });
    });

    // Pause automatic rotation while visitors interact with the slider
    bannerSlider.addEventListener("mouseenter", () => {
      clearInterval(bannerTimer);
    });

    bannerSlider.addEventListener("mouseleave", startBannerTimer);

    showBanner(0);
    startBannerTimer();
  </script>
